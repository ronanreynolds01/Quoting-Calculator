                          color: '#9fb0d9'
                        }}>
                          <div style={{ marginBottom: 4 }}>Lights-Out Capacity: {lightsOutInputs.numPallets * lightsOutInputs.partsPerPallet} parts per run</div>
                          <div>Time per pallet: {((lightsOutInputs.partsPerPallet * lightsOutInputs.cycleTimePerPart) / 60).toFixed(2)} hours</div>
                        </div>
                      </>
                    ) : (
                      <>
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, alignItems: 'center' }}>
                          <label style={{ fontSize: 12, color: '#9fb0d9' }}>Bar Length (inches)</label>
                          <input
                            type="number"
                            value={lightsOutInputs.barLength}
                            onChange={e => setLightsOutInputs({ ...lightsOutInputs, barLength: parseFloat(e.target.value) || 0 })}
                            style={inputStyle}
                          />
                        </div>

                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, alignItems: 'center' }}>
                          <label style={{ fontSize: 12, color: '#9fb0d9' }}>Part Length (inches)</label>
                          <input
                            type="number"
                            step="0.125"
                            value={lightsOutInputs.partLength}
                            onChange={e => setLightsOutInputs({ ...lightsOutInputs, partLength: parseFloat(e.target.value) || 0 })}
                            style={inputStyle}
                          />
                        </div>

                        <div style={{
                          padding: 10,
                          background: '#0b1220',
                          borderRadius: 8,
                          fontSize: 12,
                          color: '#9fb0d9'
                        }}>
                          <div style={{ marginBottom: 4 }}>Parts per Bar: {lightsOutInputs.partLength > 0 ? Math.floor(lightsOutInputs.barLength / lightsOutInputs.partLength) : 0}</div>
                          <div>Bar Run Time: {lightsOutInputs.partLength > 0 ? ((Math.floor(lightsOutInputs.barLength / lightsOutInputs.partLength) * lightsOutInputs.cycleTimePerPart) / 60).toFixed(2) : 0} hours</div>
                        </div>
                      </>
                    )}

                    <div style={{ height: 1, background: 'rgba(255,255,255,0.08)', margin: '8px 0' }} />
                    <div style={{ fontSize: 13, color: '#c7d6ff', marginBottom: 4 }}>Shift Configuration</div>

                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, alignItems: 'center' }}>
                      <label style={{ fontSize: 12, color: '#9fb0d9', display: 'flex', alignItems: 'center' }}>
                        Manned Hours/Day
                        <Tooltip text="Hours per day with an operator present. Machine runs attended during this time." />
                      </label>
                      <input
                        type="number"
                        value={lightsOutInputs.mannedHoursPerDay}
                        onChange={e => setLightsOutInputs({ ...lightsOutInputs, mannedHoursPerDay: parseFloat(e.target.value) || 0 })}
                        style={inputStyle}
                      />
                    </div>

                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, alignItems: 'center' }}>
                      <label style={{ fontSize: 12, color: '#9fb0d9', display: 'flex', alignItems: 'center' }}>
                        Lights-Out Hours Available
                        <Tooltip text="Hours available for unattended operation. Actual hours used depends on how many pallets finish in this time." />
                      </label>
                      <input
                        type="number"
                        value={lightsOutInputs.lightsOutHoursAvailable}
                        onChange={e => setLightsOutInputs({ ...lightsOutInputs, lightsOutHoursAvailable: parseFloat(e.target.value) || 0 })}
                        style={inputStyle}
                      />
                    </div>

                    <div style={{
                      padding: 10,
                      background: '#0b1220',
                      borderRadius: 8,
                      fontSize: 12,
                      color: '#9fb0d9'
                    }}>
                      {lightsOutInputs.machineType === 'pallet-mill' ? (
                        <div>Day Shift Capacity: {(() => {
                          const timePerPallet = (lightsOutInputs.partsPerPallet * lightsOutInputs.cycleTimePerPart) / 60;
                          if (timePerPallet === 0) return 0;
                          const changes = Math.floor(lightsOutInputs.mannedHoursPerDay / timePerPallet);
                          return changes * lightsOutInputs.partsPerPallet;
                        })()} parts per day</div>
                      ) : (
                        (() => {
                          const partsPerBar = lightsOutInputs.partLength > 0 ? Math.floor(lightsOutInputs.barLength / lightsOutInputs.partLength) : 0;
                          const cycleTime = lightsOutInputs.cycleTimePerPart;
                          const mannedHours = lightsOutInputs.mannedHoursPerDay;
                          const lightsOutHours = lightsOutInputs.lightsOutHoursAvailable;
                          
                          if (partsPerBar === 0 || cycleTime === 0) {
                            return <div>Enter bar and part dimensions</div>;
                          }
                          
                          const timePerBar = (partsPerBar * cycleTime) / 60;
                          
                          // Parts completed during manned shift
                          const partsInMannedHours = Math.floor((mannedHours * 60) / cycleTime);
                          
                          // If bar finishes during shift
                          if (timePerBar <= mannedHours) {
                            const completeBars = Math.floor(mannedHours / timePerBar);
                            const partsFromCompleteBars = completeBars * partsPerBar;
                            const remainingTime = mannedHours - (completeBars * timePerBar);
                            const additionalParts = Math.floor((remainingTime * 60) / cycleTime);
                            
                            return (
                              <div>
                                <div>☀️ Day Shift: {partsFromCompleteBars + additionalParts} parts ({completeBars} complete bars + {additionalParts} parts)</div>
                                <div style={{ marginTop: 4 }}>🌙 Lights-Out ({lightsOutHours}h available): Run additional bars</div>
                              </div>
                            );
                          } else {
                            // Bar extends into lights-out
                            const partsLeftOnBar = partsPerBar - partsInMannedHours;
                            const hoursNeededForRemainder = (partsLeftOnBar * cycleTime) / 60;
                            
                            return (
                              <div>
                                <div>☀️ Day Shift: {partsInMannedHours} parts (bar continues...)</div>
                                <div style={{ marginTop: 4 }}>🌙 Lights-Out ({lightsOutHours}h available): {Math.min(partsLeftOnBar, Math.floor((lightsOutHours * 60) / cycleTime))} more parts ({hoursNeededForRemainder.toFixed(1)}h needed to finish bar)</div>
                              </div>
                            );
                          }
                        })()
                      )}
                    </div>

                    <div style={{
                      padding: 12,
                      background: '#4fd18b22',
                      borderRadius: 8,
                      border: '1px solid #4fd18b44',
                      textAlign: 'center'
                    }}>
                      <div style={{ fontSize: 11, color: '#9fb0d9', marginBottom: 4 }}>Total Lights-Out Hours for Job</div>
                      <div style={{ fontSize: 24, fontWeight: 'bold', color: '#4fd18b' }}>
                        {(() => {
                          const totalParts = qty;
                          const cycleTimePerPart = lightsOutInputs.cycleTimePerPart;
                          const mannedHoursPerDay = lightsOutInputs.mannedHoursPerDay;
                          const lightsOutHours = lightsOutInputs.lightsOutHoursAvailable;
                          
                          if (lightsOutInputs.machineType === 'pallet-mill') {
                            // PALLET MILL LOGIC - Pallets run SEQUENTIALLY (one after another)
                            const numPallets = lightsOutInputs.numPallets;
                            const partsPerPallet = lightsOutInputs.partsPerPallet;
                            
                            if (cycleTimePerPart === 0 || partsPerPallet === 0 || numPallets === 0) return '0.00';
                            
                            // Time for one complete pallet
                            const timePerPallet = (partsPerPallet * cycleTimePerPart) / 60;
                            
                            // How many of our physical pallets can finish in available time?
                            const palletsThatCanFinish = Math.min(numPallets, Math.floor(lightsOutHours / timePerPallet));
                            const maxPartsPerNight = palletsThatCanFinish * partsPerPallet;
                            
                            let remainingParts = totalParts;
                            let totalLightsOutHours = 0;
                            
                            while (remainingParts > 0) {
                              // Manned shift - run parts during the day
                              const partsInMannedHours = Math.floor((mannedHoursPerDay * 60) / cycleTimePerPart);
                              remainingParts -= Math.min(partsInMannedHours, remainingParts);
                              
                              if (remainingParts <= 0) break;
                              
                              // Lights-out - load pallets and run sequentially
                              const partsToMakeTonight = Math.min(remainingParts, maxPartsPerNight);
                              const palletsToRun = Math.ceil(partsToMakeTonight / partsPerPallet);
                              const hoursUsed = palletsToRun * timePerPallet;
                              
                              totalLightsOutHours += hoursUsed;
                              remainingParts -= partsToMakeTonight;
                            }
                            
                            return totalLightsOutHours.toFixed(2);
                            
                          } else {
                            // BAR-FED LATHE LOGIC
                            const barLength = lightsOutInputs.barLength;
                            const partLength = lightsOutInputs.partLength;
                            
                            if (partLength === 0 || barLength === 0 || cycleTimePerPart === 0) return '0.00';
                            
                            const partsPerBar = Math.floor(barLength / partLength);
                            const timePerBar = (partsPerBar * cycleTimePerPart) / 60;
                            
                            let remainingParts = totalParts;
                            let totalLightsOutHours = 0;
                            
                            while (remainingParts > 0) {
                              const mannedHours = mannedHoursPerDay;
                              
                              // How many parts done during manned shift?
                              const partsInMannedHours = Math.floor((mannedHours * 60) / cycleTimePerPart);
                              
                              if (timePerBar <= mannedHours) {
                                // Bar finishes during shift - run more bars in lights-out
                                const completeBars = Math.floor(mannedHours / timePerBar);
                                const partsFromCompleteBars = completeBars * partsPerBar;
                                remainingParts -= Math.min(partsFromCompleteBars, remainingParts);
                                
                                // Use FULL lights-out hours available
                                if (remainingParts > 0) {
                                  const partsInLightsOut = Math.floor((lightsOutHours * 60) / cycleTimePerPart);
                                  const lightsOutPartsToMake = Math.min(partsInLightsOut, remainingParts);
                                  const actualHoursUsed = (lightsOutPartsToMake * cycleTimePerPart) / 60;
                                  totalLightsOutHours += actualHoursUsed;
                                  remainingParts -= lightsOutPartsToMake;
                                }
                              } else {
                                // Bar extends past shift - use full lights-out hours
                                const partsInLightsOut = Math.floor((lightsOutHours * 60) / cycleTimePerPart);
                                const lightsOutPartsToMake = Math.min(partsInLightsOut, remainingParts);
                                const actualHoursUsed = (lightsOutPartsToMake * cycleTimePerPart) / 60;
                                
                                totalLightsOutHours += actualHoursUsed;
                                remainingParts -= Math.min(partsInMannedHours + lightsOutPartsToMake, remainingParts);
                              }
                            }
                            
                            return totalLightsOutHours.toFixed(2);
                          }
                        })()} hours
                      </div>
                      <div style={{ fontSize: 11, color: '#9fb0d9', marginTop: 8, lineHeight: 1.6 }}>
                        {lightsOutInputs.machineType === 'pallet-mill' ? (
                          (() => {
                            const totalParts = qty;
                            const cycleTimePerPart = lightsOutInputs.cycleTimePerPart;
                            const numPallets = lightsOutInputs.numPallets;
                            const partsPerPallet = lightsOutInputs.partsPerPallet;
                            const mannedHoursPerDay = lightsOutInputs.mannedHoursPerDay;
                            const lightsOutHours = lightsOutInputs.lightsOutHoursAvailable;
                            
                            if (cycleTimePerPart === 0 || partsPerPallet === 0 || numPallets === 0) {
                              return <div>Enter cycle time, parts per pallet, and number of pallets</div>;
                            }
                            
                            // Time for one complete pallet
                            const timePerPallet = (partsPerPallet * cycleTimePerPart) / 60;
                            
                            // How many pallets can finish in lights-out time?
                            const palletsThatCanFinish = Math.min(numPallets, Math.floor(lightsOutHours / timePerPallet));
                            const maxPartsPerNight = palletsThatCanFinish * partsPerPallet;
                            
                            let remainingParts = totalParts;
                            let totalMannedParts = 0;
                            let totalLightsOutParts = 0;
                            let daysNeeded = 0;
                            
                            while (remainingParts > 0 && daysNeeded < 100) {
                              daysNeeded++;
                              
                              // Manned shift
                              const partsThisShift = Math.floor((mannedHoursPerDay * 60) / cycleTimePerPart);
                              const mannedPartsToday = Math.min(partsThisShift, remainingParts);
                              totalMannedParts += mannedPartsToday;
                              remainingParts -= mannedPartsToday;
                              
                              if (remainingParts <= 0) break;
                              
                              // Lights-out
                              const partsThisNight = Math.min(remainingParts, maxPartsPerNight);
                              totalLightsOutParts += partsThisNight;
                              remainingParts -= partsThisNight;
                            }
                            
                            return (
                              <>
                                <div style={{ marginBottom: 4, fontSize: 12, color: '#c7d6ff', fontWeight: 600 }}>Typical Day Breakdown:</div>
                                <div style={{ fontSize: 11, marginBottom: 8 }}>This job needs ~{daysNeeded} days total</div>
                                <div style={{ background: 'rgba(79,209,139,0.05)', padding: 10, borderRadius: 6, marginBottom: 8 }}>
                                  <div style={{ marginBottom: 4 }}>☀️ <strong>Day Shift ({mannedHoursPerDay}h available):</strong></div>
                                  <div style={{ marginLeft: 16, fontSize: 11 }}>
                                    • {totalMannedParts} parts manned per day
                                  </div>
                                </div>
                                <div style={{ background: 'rgba(47,107,255,0.05)', padding: 10, borderRadius: 6 }}>
                                  <div style={{ marginBottom: 4 }}>🌙 <strong>Lights-Out ({lightsOutHours}h available):</strong></div>
                                  <div style={{ marginLeft: 16, fontSize: 11 }}>
                                    • {totalLightsOutParts} parts unmanned per day
                                    <br />• Total lights-out hours needed: {((totalLightsOutParts * cycleTimePerPart) / 60).toFixed(2)}h per day
                                  </div>
                                </div>
                              </>
                            );
                          })()
                        ) : (
                          (() => {
                            const totalParts = qty;
                            const cycleTimePerPart = lightsOutInputs.cycleTimePerPart;
                            const barLength = lightsOutInputs.barLength;
                            const partLength = lightsOutInputs.partLength;
                            const mannedHoursPerDay = lightsOutInputs.mannedHoursPerDay;
                            const lightsOutHours = lightsOutInputs.lightsOutHoursAvailable;
                            
                            if (partLength === 0 || barLength === 0 || cycleTimePerPart === 0) {
                              return <div style={{ fontSize: 11 }}>Enter bar dimensions and cycle time</div>;
                            }
                            
                            const partsPerBar = Math.floor(barLength / partLength);
                            const timePerBar = (partsPerBar * cycleTimePerPart) / 60;
                            
                            let remainingParts = totalParts;
                            let totalMannedParts = 0;
                            let totalLightsOutParts = 0;
                            let daysNeeded = 0;
                            
                            while (remainingParts > 0 && daysNeeded < 365) {
                              daysNeeded++;
                              const mannedHours = mannedHoursPerDay;
                              
                              // Parts done during manned shift
                              const partsInMannedHours = Math.floor((mannedHours * 60) / cycleTimePerPart);
                              
                              if (timePerBar <= mannedHours) {
                                // Bar finishes during shift
                                const completeBars = Math.floor(mannedHours / timePerBar);
                                const partsFromCompleteBars = completeBars * partsPerBar;
                                const partsDoneToday = Math.min(partsFromCompleteBars, remainingParts);
                                totalMannedParts += partsDoneToday;
                                remainingParts -= partsDoneToday;
                                
                                // Lights-out: use FULL hours available
                                if (remainingParts > 0) {
                                  const partsInLightsOut = Math.floor((lightsOutHours * 60) / cycleTimePerPart);
                                  const lightsOutPartsToday = Math.min(partsInLightsOut, remainingParts);
                                  totalLightsOutParts += lightsOutPartsToday;
                                  remainingParts -= lightsOutPartsToday;
                                }
                              } else {
                                // Bar extends past shift - use full lights-out hours
                                const mannedPartsToday = Math.min(partsInMannedHours, remainingParts);
                                totalMannedParts += mannedPartsToday;
                                remainingParts -= mannedPartsToday;
                                
                                if (remainingParts > 0) {
                                  const partsInLightsOut = Math.floor((lightsOutHours * 60) / cycleTimePerPart);
                                  const lightsOutPartsToday = Math.min(partsInLightsOut, remainingParts);
                                  totalLightsOutParts += lightsOutPartsToday;
                                  remainingParts -= lightsOutPartsToday;
                                }
                              }
                            }
                            
                            return (
                              <>
                                <div style={{ marginBottom: 4, fontSize: 12, color: '#c7d6ff', fontWeight: 600 }}>Typical Day Breakdown:</div>
                                <div style={{ fontSize: 11, marginBottom: 8 }}>This job needs ~{daysNeeded} days total</div>
                                <div style={{ background: 'rgba(79,209,139,0.05)', padding: 10, borderRadius: 6, marginBottom: 8 }}>
                                  <div style={{ marginBottom: 4 }}>☀️ <strong>Day Shift ({mannedHoursPerDay}h available):</strong></div>
                                  <div style={{ marginLeft: 16, fontSize: 11 }}>
                                    • {totalMannedParts} parts manned per day
                                  </div>
                                </div>
                                <div style={{ background: 'rgba(47,107,255,0.05)', padding: 10, borderRadius: 6 }}>
                                  <div style={{ marginBottom: 4 }}>🌙 <strong>Lights-Out ({lightsOutHours}h available):</strong></div>
                                  <div style={{ marginLeft: 16, fontSize: 11 }}>
                                    • {totalLightsOutParts} parts unmanned per day
                                    <br />• Total lights-out hours needed: {((totalLightsOutParts * cycleTimePerPart) / 60).toFixed(2)}h per day
                                  </div>
                                </div>
                              </>
                            );
                          })()
                        )}
                      </div>
                    </div>

                    <div style={{ display: 'flex', gap: 8, marginTop: 8 }}>
                      <button onClick={applyLightsOutCalc} style={{
                        flex: 1,
                        padding: '10px',
                        borderRadius: 8,
                        border: '1px solid #2f6bff',
                        background: '#2f6bff',
                        color: 'white',
                        cursor: 'pointer',
                        fontSize: 13
                      }}>Apply</button>

                      <button onClick={() => setShowLightsOutCalc(false)} style={{
                        flex: 1,
                        padding: '10px',
                        borderRadius: 8,
                        border: '1px solid rgba(255,255,255,0.08)',
                        background: '#121c35',
                        color: '#9fb0d9',
                        cursor: 'pointer',
                        fontSize: 13
                      }}>Cancel</button>
                    </div>
                  </div>
                </div>
              </>
            )}

          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<JobCostingCalculator />);
    </script>
  </body>
</html>
