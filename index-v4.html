    <script type="text/babel">
      const { useState, useEffect } = React;

      /***************
       * localStorage wrapper (matches your window.storage calls)
       ***************/
      window.storage = {
        async set(key, value) {
          localStorage.setItem(key, value);
          return true;
        },
        async get(key) {
          const v = localStorage.getItem(key);
          return { value: v };
        },
        async delete(key) {
          localStorage.removeItem(key);
          return true;
        },
        async list(prefix = "") {
          const keys = [];
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.startsWith(prefix)) keys.push(k);
          }
          return { keys };
        }
      };

      /***************

      const HelpIcon = ({ size = 14, style = {}, ...props }) => (

          <circle cx="12" cy="12" r="10" />

      /***************
       * Styles (same as your component)
       ***************/
      const inputStyle = {
        width: '100%',
        padding: '9px 10px',
        borderRadius: 10,
        border: '1px solid rgba(255,255,255,0.08)',
        background: '#0b1220',
        color: '#eaf0ff'
      };

      const cardStyle = {

        border: '1px solid rgba(255,255,255,0.08)',
        borderRadius: 16,

      };

      const cardHeaderStyle = {

      };

      const tdStyle = {

      const calcBtnStyle = {
        borderRadius: 8,

        border: '1px solid rgba(255,255,255,0.08)',

      };

      const Tooltip = ({ text }) => {
        const [show, setShow] = useState(false);
        return (
          <div 
            style={{ position: 'relative', display: 'inline-flex', alignItems: 'center', marginLeft: 4, cursor: 'help' }}

            onClick={(e) => {

              setShow(!show);
            }}
          >
            <HelpIcon
              size={14}

            />
            {show && (
              <div style={{

                background: '#1a2744',

      };

      function JobCostingCalculator() {
        const [machines, setMachines] = useState([
          { id: 1, name: 'Haas VF-2', rate: 85 },
          { id: 2, name: 'DMG Mori NLX', rate: 95 }
        ]);
        const [overheadRate, setOverheadRate] = useState(45);
        const [toolingBurden, setToolingBurden] = useState(0);
        const [laborRates, setLaborRates] = useState({
          setup: 65,
          mannedRun: 65,
          programming: 75,
          manufacturingPlanner: 70,
          materials: 60,
          inspection: 55,
          shippingReceiving: 50,
          assembly: 55,
          rework: 65
        });
        const [laborBurdenPercent, setLaborBurdenPercent] = useState(0);

        // Load machines from localStorage on mount
        useEffect(() => {
          const loadMachines = async () => {
            try {
              const result = await window.storage.get('machines');
              if (result && result.value) {
                setMachines(JSON.parse(result.value));
              }
            } catch (err) {
              console.log('No saved machines found, using defaults');
            }
          };
          loadMachines();
        }, []);

        // Save machines to localStorage whenever they change
        useEffect(() => {
          const saveMachines = async () => {
            try {
              await window.storage.set('machines', JSON.stringify(machines));
            } catch (err) {
              console.error('Failed to save machines:', err);
            }
          };
          saveMachines();
        }, [machines]);

        // Load settings from localStorage on mount
        useEffect(() => {
          const loadSettings = async () => {
            try {
              const result = await window.storage.get('settings');
              if (result && result.value) {
                const saved = JSON.parse(result.value);
                if (saved.overheadRate !== undefined) setOverheadRate(saved.overheadRate);
                if (saved.toolingBurden !== undefined) setToolingBurden(saved.toolingBurden);
                
                // Migrate old labor rates to new format
                if (saved.laborRates) {
                  const migratedRates = { ...saved.laborRates };
                  
                  // Remove old unmannedRun if it exists
                  if (migratedRates.unmannedRun !== undefined) {
                    delete migratedRates.unmannedRun;
                  }
                  
                  // Add new rates with defaults if they don't exist
                  if (migratedRates.manufacturingPlanner === undefined) {
                    migratedRates.manufacturingPlanner = 70;
                  }
                  if (migratedRates.materials === undefined) {
                    migratedRates.materials = 60;
                  }
                  if (migratedRates.shippingReceiving === undefined) {
                    migratedRates.shippingReceiving = 50;
                  }
                  
                  setLaborRates(migratedRates);
                }
                
                if (saved.laborBurdenPercent !== undefined) setLaborBurdenPercent(saved.laborBurdenPercent);
                if (saved.targetMargin !== undefined) setTargetMargin(saved.targetMargin);
                if (saved.scrapRate !== undefined) setScrapRate(saved.scrapRate);
              }
            } catch (err) {
              console.log('No saved settings found, using defaults');
            }
          };
          loadSettings();
        }, []);

        // Save settings to localStorage whenever they change
        useEffect(() => {
          const saveSettings = async () => {
            try {
              const settings = {
                overheadRate,
                toolingBurden,
                laborRates,
                laborBurdenPercent,
                targetMargin,
                scrapRate
              };
              await window.storage.set('settings', JSON.stringify(settings));
            } catch (err) {
              console.error('Failed to save settings:', err);
            }
          };
          saveSettings();
        }, [overheadRate, toolingBurden, laborRates, laborBurdenPercent, targetMargin, scrapRate]);



        const [partNo, setPartNo] = useState('');
        const [qty, setQty] = useState(1);
        const [targetMargin, setTargetMargin] = useState(30);
        const [scrapRate, setScrapRate] = useState(5);
        const [includeBurdenedTooling, setIncludeBurdenedTooling] = useState(false);

        const [materialMode, setMaterialMode] = useState('Total');
        const [outsideProcessingMode, setOutsideProcessingMode] = useState('Total');
        const [materialCost, setMaterialCost] = useState(0);
        const [outsideProcessing, setOutsideProcessing] = useState(0);
        const [directTooling, setDirectTooling] = useState(0);

        const [showShopConfig, setShowShopConfig] = useState(false);
        const [showDetailedBreakdown, setShowDetailedBreakdown] = useState(false);
        const [showLaborCalc, setShowLaborCalc] = useState(false);
        const [showOverheadCalc, setShowOverheadCalc] = useState(false);
        const [showToolingCalc, setShowToolingCalc] = useState(false);

        const [laborCalcInputs, setLaborCalcInputs] = useState({ wages: 0, burdenCost: 0 });
        const [overheadCalcInputs, setOverheadCalcInputs] = useState({ totalOverhead: 0, totalMachineHours: 0 });
        const [showMachineHoursCalc, setShowMachineHoursCalc] = useState(false);
        const [machineHoursInputs, setMachineHoursInputs] = useState({
          weeks: 52,
          numMachines: 1,
          daysPerWeek: 5,
          hoursPerDay: 8,
          productivityBuffer: 75
        });
        const [toolingCalcInputs, setToolingCalcInputs] = useState({ totalTooling: 0, periodMachineHours: 0 });
        const [showMachineHoursCalcTooling, setShowMachineHoursCalcTooling] = useState(false);
        const [machineHoursInputsTooling, setMachineHoursInputsTooling] = useState({
          weeks: 52,
          numMachines: 1,
          daysPerWeek: 5,
          hoursPerDay: 8,
          productivityBuffer: 75
        });

        const [newMachineName, setNewMachineName] = useState('');
        const [newMachineRate, setNewMachineRate] = useState('');
        const [showMachineRateCalc, setShowMachineRateCalc] = useState(false);
        const [editingMachineId, setEditingMachineId] = useState(null);
        const [machineRateInputs, setMachineRateInputs] = useState({
          purchasePrice: 0,
          residualValue: 0,
          usefulLife: 10,
          annualInterest: 0,
          annualSupport: 0,
          maintenancePercent: 5,
          plannedHours: 2000,
          targetMargin: 20
        });

        // Operations routing
        const [operations, setOperations] = useState([]);
        const [showLightsOutCalc, setShowLightsOutCalc] = useState(false);
        const [version, setVersion] = useState('v2'); // 'v1' or 'v2'

        const [showLightsOutDetails, setShowLightsOutDetails] = useState(false);
        const [editingOpIndex, setEditingOpIndex] = useState(null);
        const [lightsOutInputs, setLightsOutInputs] = useState({
          cycleTimePerPart: 0,
          numPallets: 4,
          partsPerPallet: 1,
          mannedHoursPerDay: 8
        });

        // Saved Jobs
        const [savedJobs, setSavedJobs] = useState([]);
        const [showSavedJobs, setShowSavedJobs] = useState(false);
        const [showHelp, setShowHelp] = useState(false);
        const [helpSection, setHelpSection] = useState('quick-guide');
        
        // Templates
        const [templates, setTemplates] = useState([]);
        const [showTemplates, setShowTemplates] = useState(false);
        
        // Cost Breakdown Modal
        const [showCostBreakdown, setShowCostBreakdown] = useState(false);
        
        // Help/Instructions Modal
        
        
        
        // NRE
        const [nreEnabled, setNreEnabled] = useState(false);
        const [nreOperations, setNreOperations] = useState([]);


        // Calculate costs from operations (recurring production)
        const operationsCosts = operations.reduce((acc, op) => {
          if (op.type === 'Manufacturing') {
            const machine = machines.find(m => m.name === op.machine);
            const machineRate = machine?.rate || 0;
            
            // Setup time (hours)
            const setupHours = op.setupTime / 60;
            
            // Total cycle time needed for all parts (hours)
            const totalCycleHours = (op.cycleTimeManned / 60) * qty;
            
            // Lights-out time (hours) - this REPLACES part of the manned time
            const lightsOutHours = op.lightsOutHours || 0;
            
            // Split cycle time: what can be done lights-out vs. what needs to be manned
            const actualLightsOutHours = Math.min(lightsOutHours, totalCycleHours); // Can't be more than total
            const mannedRunHours = totalCycleHours - actualLightsOutHours; // Remainder is manned
            
            // Total machine hours for this operation
            const opMachineHours = setupHours + totalCycleHours; // Machine runs for setup + all cycle time
            
            // Labor costs - ONLY charged during setup and manned run
            const setupLabor = setupHours * laborRates.setup;
            const mannedLabor = mannedRunHours * laborRates.mannedRun;
            // Lights-out has NO labor cost
            
            return {
              totalMachineHours: acc.totalMachineHours + opMachineHours,
              toolingMachineHours: acc.toolingMachineHours + opMachineHours,
              laborCost: acc.laborCost + setupLabor + mannedLabor,
              machineCost: acc.machineCost + (opMachineHours * machineRate)
            };
          } else if (op.type === 'Programming') {
            // Programming: setup time only
            const progHours = (op.setupTime || 0) / 60;
            return {
              ...acc,
              laborCost: acc.laborCost + (progHours * laborRates.programming)
            };
          } else if (op.type === 'Planning') {
            // Planning: setup time only
            const planHours = (op.setupTime || 0) / 60;
            return {
              ...acc,
              laborCost: acc.laborCost + (planHours * laborRates.manufacturingPlanner)
            };
          } else if (op.type === 'Stock Prep') {
            // Stock Prep: like Manufacturing but no lights-out
            const machine = machines.find(m => m.name === op.machine);
            const machineRate = machine?.rate || 0;
            
            // Setup time (hours)
            const setupHours = op.setupTime / 60;
            
            // Total cycle time for all parts (hours) - all manned
            const cycleHours = (op.cycleTimeManned / 60) * qty;
            
            // Total machine hours
            const opMachineHours = setupHours + cycleHours;
            
            // Labor costs - setup + all cycle time at materials rate
            const setupLabor = setupHours * laborRates.materials;
            const cycleLabor = cycleHours * laborRates.materials;
            
            return {
              totalMachineHours: acc.totalMachineHours + opMachineHours,
              toolingMachineHours: acc.toolingMachineHours, // Stock Prep does NOT add to tooling
              laborCost: acc.laborCost + setupLabor + cycleLabor,
              machineCost: acc.machineCost + (opMachineHours * machineRate)
            };
          } else if (op.type === 'Fixture Development') {
            // Fixture Development: uses Setup rate, includes machine costs and tooling
            const machine = machines.find(m => m.name === op.machine);
            const machineRate = machine?.rate || 0;
            
            // Setup time (hours)
            const setupHours = op.setupTime / 60;
            
            // Cycle time (hours) - for building the fixture
            const cycleHours = (op.cycleTimeManned / 60) * qty;
            
            // Total machine hours
            const opMachineHours = setupHours + cycleHours;
            
            // Labor costs - all at setup (machinist) rate
            const setupLabor = setupHours * laborRates.setup;
            const cycleLabor = cycleHours * laborRates.setup;
            
            return {
              totalMachineHours: acc.totalMachineHours + opMachineHours,
              toolingMachineHours: acc.toolingMachineHours + opMachineHours, // Fixture Dev DOES add to tooling
              laborCost: acc.laborCost + setupLabor + cycleLabor,
              machineCost: acc.machineCost + (opMachineHours * machineRate)
            };
          } else if (op.type === 'Inspection') {
            // Inspection: setup + cycle time
            const setupHours = (op.setupTime || 0) / 60;
            const cycleHours = ((op.cycleTimeManned || 0) / 60) * qty;
            const totalInspHours = setupHours + cycleHours;
            return {
              ...acc,
              laborCost: acc.laborCost + (totalInspHours * laborRates.inspection)
            };
          } else if (op.type === 'Assembly') {
            // Assembly: setup + cycle time
            const setupHours = (op.setupTime || 0) / 60;
            const cycleHours = ((op.cycleTimeManned || 0) / 60) * qty;
            const totalAssemblyHours = setupHours + cycleHours;
            const assemblyRate = laborRates.assembly || 55; // Fallback to 55 if not found
            return {
              ...acc,
              laborCost: acc.laborCost + (totalAssemblyHours * assemblyRate)
            };
          } else if (op.type === 'Shipping') {
            // Shipping: setup time only
            const shipHours = (op.setupTime || 0) / 60;
            return {
              ...acc,
              laborCost: acc.laborCost + (shipHours * laborRates.shippingReceiving)
            };
          }
          // Outside Processing has no costs (entered manually in COGS)
          return acc;
        }, { totalMachineHours: 0, laborCost: 0, machineCost: 0, toolingMachineHours: 0 });

        // Calculate NRE costs from nreSetupTime
        const nreCosts = operations.reduce((acc, op) => {
          const nreSetup = (op.nreSetupTime || 0) / 60; // Convert to hours
          
          if (nreSetup === 0) return acc; // Skip if no NRE time
          
          if (op.type === 'Manufacturing') {
            const machine = machines.find(m => m.name === op.machine);
            const machineRate = machine?.rate || 0;
            
            // NRE charges: setup labor + machine + overhead + tooling
            const nreLabor = nreSetup * laborRates.setup;
            const nreMachine = nreSetup * machineRate;
            
            return {
              totalMachineHours: acc.totalMachineHours + nreSetup,
              laborCost: acc.laborCost + nreLabor,
              machineCost: acc.machineCost + nreMachine,
              toolingMachineHours: acc.toolingMachineHours + nreSetup
            };
          } else if (op.type === 'Programming') {
            const nreLabor = nreSetup * laborRates.programming;
            return {
              ...acc,
              laborCost: acc.laborCost + nreLabor
            };
          } else if (op.type === 'Planning') {
            const nreLabor = nreSetup * laborRates.programming;
            return {
              ...acc,
              laborCost: acc.laborCost + nreLabor
            };
          } else if (op.type === 'Stock Prep') {
            const machine = machines.find(m => m.name === op.machine);
            const machineRate = machine?.rate || 0;
            
            const nreLabor = nreSetup * laborRates.materials;
            const nreMachine = nreSetup * machineRate;
            
            return {
              totalMachineHours: acc.totalMachineHours + nreSetup,
              laborCost: acc.laborCost + nreLabor,
              machineCost: acc.machineCost + nreMachine
              // Stock Prep does NOT add to tooling
            };
          } else if (op.type === 'Fixture Development') {
            const machine = machines.find(m => m.name === op.machine);
            const machineRate = machine?.rate || 0;
            
            // Fixture Development NRE uses setup (machinist) rate
            const nreLabor = nreSetup * laborRates.setup;
            const nreMachine = nreSetup * machineRate;
            
            return {
              totalMachineHours: acc.totalMachineHours + nreSetup,
              laborCost: acc.laborCost + nreLabor,
              machineCost: acc.machineCost + nreMachine,
              toolingMachineHours: acc.toolingMachineHours + nreSetup // Fixture Dev DOES add to tooling
            };
          } else if (op.type === 'Inspection') {
            const nreLabor = nreSetup * laborRates.inspection;
            return {
              ...acc,
              laborCost: acc.laborCost + nreLabor
            };
          } else if (op.type === 'Assembly') {
            const assemblyRate = laborRates.assembly || 55; // Fallback to 55 if not found
            const nreLabor = nreSetup * assemblyRate;
            return {
              ...acc,
              laborCost: acc.laborCost + nreLabor
            };
          } else if (op.type === 'Shipping') {
            const nreLabor = nreSetup * laborRates.shippingReceiving;
            return {
              ...acc,
              laborCost: acc.laborCost + nreLabor
            };
          }
          
          return acc;
        }, { totalMachineHours: 0, laborCost: 0, machineCost: 0, toolingMachineHours: 0 });

        // Apply labor burden
        const laborCost = operationsCosts.laborCost * (1 + laborBurdenPercent / 100);
        const totalMachineHours = operationsCosts.totalMachineHours;
        const machineCost = operationsCosts.machineCost;
        const overheadCost = totalMachineHours * overheadRate;
        
        // Calculate NRE totals
        const nreLaborCost = nreCosts.laborCost * (1 + laborBurdenPercent / 100);
        const nreTotalMachineHours = nreCosts.totalMachineHours;
        const nreMachineCost = nreCosts.machineCost;
        const nreOverheadCost = nreTotalMachineHours * overheadRate;

        const actualMaterialCost = materialMode === 'Per Part'
          ? materialCost * qty
          : materialCost;
        
        const actualOutsideProcessing = outsideProcessingMode === 'Per Part'
          ? (parseFloat(outsideProcessing || 0) * qty)
          : parseFloat(outsideProcessing || 0);
        
        // Sum fixture material costs from all Fixture Development operations
        const totalFixtureMaterialCost = operations.reduce((sum, op) => {
          if (op.type === 'Fixture Development') {
            return sum + (parseFloat(op.fixtureMaterialCost) || 0);
          }
          return sum;
        }, 0);

        const burdenedToolingCost = includeBurdenedTooling
          ? operationsCosts.toolingMachineHours * toolingBurden
          : 0;
        
        const nreBurdenedToolingCost = includeBurdenedTooling
          ? nreCosts.toolingMachineHours * toolingBurden
          : 0;
        
        // Total NRE cost (one-time)
        const totalNreCost = nreLaborCost + nreMachineCost + nreOverheadCost + nreBurdenedToolingCost;
        
        // Per-part NRE cost (amortized across quantity)
        const nrePerPart = totalNreCost / qty;
        
        // Calculate lead time (only if we have operations and valid qty)
        const leadTimeCalc = (operations.length > 0 && qty > 0) ? operations.reduce((acc, op) => {
          if (op.type === 'Outside Processing') {
            // Outside processing adds lead days directly
            return {
              ...acc,
              outsideProcessingDays: acc.outsideProcessingDays + (parseFloat(op.outsideLeadDays) || 0)
            };
          } else {
            // Manufacturing operations - estimate days based on hours
            // This includes setup + cycle time for all types
            let opHours = 0;
            
            if (op.type === 'Manufacturing') {
              const setupHours = (op.setupTime || 0) / 60;
              const cycleHours = ((op.cycleTimeManned || 0) / 60) * qty;
              const lightsOutHours = op.lightsOutHours || 0;
              opHours = setupHours + cycleHours + lightsOutHours;
            } else if (['Stock Prep', 'Fixture Development'].includes(op.type)) {
              const setupHours = (op.setupTime || 0) / 60;
              const cycleHours = ((op.cycleTimeManned || 0) / 60) * qty;
              opHours = setupHours + cycleHours;
            } else if (op.type === 'Inspection') {
              const setupHours = (op.setupTime || 0) / 60;
              const cycleHours = ((op.cycleTimeManned || 0) / 60) * qty;
              opHours = setupHours + cycleHours;
            } else if (op.type === 'Assembly') {

              opHours = setupHours + cycleHours;
            } else {
              // Programming, Planning, Shipping - just setup time
              opHours = (op.setupTime || 0) / 60;
            }
            
            return {
              ...acc,
              manufacturingHours: acc.manufacturingHours + opHours
            };
          }

          const newOps = [...operations];
          [newOps[index], newOps[index - 1]] = [newOps[index - 1], newOps[index]];

          setLightsOutInputs({

            mannedHoursPerDay: 8,

        const applyLightsOutCalc = () => {
          const { 
            cycleTimePerPart, 
            numPallets, 
            partsPerPallet, 
            mannedHoursPerDay, 
            machineType,
            barLength,
            partLength,
            lightsOutHoursAvailable 
          } = lightsOutInputs;
          
          const totalParts = qty;
          let totalLightsOutHours = 0;
          
          if (machineType === 'bar-fed-lathe') {
            // BAR-FED LATHE LOGIC
            if (partLength === 0 || barLength === 0 || cycleTimePerPart === 0) {
              console.log('Invalid bar-fed inputs');
              setShowLightsOutCalc(false);
              return;
            }
            
            const partsPerBar = Math.floor(barLength / partLength);
            const timePerBar = (partsPerBar * cycleTimePerPart) / 60;
            
            let remainingParts = totalParts;
            
            while (remainingParts > 0) {
              const mannedHours = mannedHoursPerDay;
              const lightsOutHours = lightsOutHoursAvailable;
              
              // Parts done during manned shift
              const partsInMannedHours = Math.floor((mannedHours * 60) / cycleTimePerPart);
              
              if (timePerBar <= mannedHours) {
                // Bar finishes during shift
                const completeBars = Math.floor(mannedHours / timePerBar);
                const partsFromCompleteBars = completeBars * partsPerBar;
                remainingParts -= Math.min(partsFromCompleteBars, remainingParts);
                
                // Use FULL lights-out hours available
                if (remainingParts > 0) {
                  const partsInLightsOut = Math.floor((lightsOutHours * 60) / cycleTimePerPart);
                  const lightsOutPartsToMake = Math.min(partsInLightsOut, remainingParts);
                  const actualHoursUsed = (lightsOutPartsToMake * cycleTimePerPart) / 60;
                  totalLightsOutHours += actualHoursUsed;
                  remainingParts -= lightsOutPartsToMake;
                }
              } else {
                // Bar extends past shift
                const partsInLightsOut = Math.floor((lightsOutHours * 60) / cycleTimePerPart);
                const lightsOutPartsToMake = Math.min(partsInLightsOut, remainingParts);
                const actualHoursUsed = (lightsOutPartsToMake * cycleTimePerPart) / 60;
                
                totalLightsOutHours += actualHoursUsed;
                remainingParts -= Math.min(partsInMannedHours + lightsOutPartsToMake, remainingParts);
              }
            }
            
          } else {
            // PALLET MILL LOGIC - Pallets run SEQUENTIALLY (one after another)
            if (cycleTimePerPart === 0 || partsPerPallet === 0 || numPallets === 0) {
              console.log('Invalid pallet mill inputs');
              setShowLightsOutCalc(false);
              return;
            }
            
            const timePerPallet = (partsPerPallet * cycleTimePerPart) / 60;
            
            // How many pallets can finish in available time?
            const palletsThatCanFinish = Math.min(numPallets, Math.floor(lightsOutHoursAvailable / timePerPallet));
            const maxPartsPerNight = palletsThatCanFinish * partsPerPallet;
            
            let remainingParts = totalParts;
            
            while (remainingParts > 0) {
              // Manned shift
              const partsInMannedHours = Math.floor((mannedHoursPerDay * 60) / cycleTimePerPart);
              remainingParts -= Math.min(partsInMannedHours, remainingParts);
              
              if (remainingParts <= 0) break;
              
              // Lights-out
              const partsToMakeTonight = Math.min(remainingParts, maxPartsPerNight);
              const palletsToRun = Math.ceil(partsToMakeTonight / partsPerPallet);
              const hoursUsed = palletsToRun * timePerPallet;
              
              totalLightsOutHours += hoursUsed;
              remainingParts -= partsToMakeTonight;
            }
          }
          
          console.log('Lights-Out Hours to Apply:', totalLightsOutHours);
          
          if (editingOpIndex !== null) {

                          Annual Hours: 3,000 hours/year<br />
                          Financing: 5% interest<br />
                          <br />
                          
                          <strong>Step 1: Calculate Annual Depreciation</strong><br />
                          • (Purchase - Residual) ÷ Life<br />
                          • ($500,000 - $100,000) ÷ 10 years = <strong>$40,000/year</strong><br /><br />

                                  <td style={{ padding: '8px 0', textAlign: 'right', fontWeight: 600 }}>{((profit / suggestedQuote) * 100 || 0).toFixed(1)}%</td>
                                </tr>
                                <tr style={{ borderTop: '2px solid rgba(255,255,255,0.15)' }}>
                                  <td style={{ padding: '10px 0', fontSize: 15, fontWeight: 700, color: '#2f6bff' }}>Total Quote</td>
                                  <td style={{ padding: '10px 0', textAlign: 'right', fontSize: 15, fontWeight: 700, color: '#2f6bff' }}>{fmt(suggestedQuote + totalNreCost)}</td>
                                </tr>
                              </tbody>
                            </table>
                          </div>
                        )}
                      </div>
                    </div>

                    {/* DETAILED COST BREAKDOWN */}
                    <div style={{ marginTop: 24, borderTop: '1px solid rgba(255,255,255,0.08)', paddingTop: 24 }}>
                      <button
                        onClick={() => setShowDetailedBreakdown(!showDetailedBreakdown)}
                        style={{
                          width: '100%',
                          padding: '12px 16px',
                          background: 'rgba(47,107,255,0.1)',
                          border: '1px solid rgba(47,107,255,0.3)',
                          borderRadius: 8,
                          color: '#2f6bff',
                          cursor: 'pointer',
                          fontSize: 14,
                          fontWeight: 600,
                          display: 'flex',
                          alignItems: 'center',
                          justifyContent: 'space-between'
                        }}
                      >
                        <span>📊 Detailed Cost Breakdown</span>
                        <span>{showDetailedBreakdown ? '▼' : '▶'}</span>
                      </button>

                      {showDetailedBreakdown && (
                        <div style={{ marginTop: 16, background: 'rgba(255,255,255,0.02)', padding: 20, borderRadius: 8 }}>
                          {(() => {
                            // Group operations by type
                            const opsByType = operations.reduce((acc, op) => {
                              if (!acc[op.type]) acc[op.type] = [];
                              acc[op.type].push(op);
                              return acc;
                            }, {});

                            // Calculate costs per operation type
                            const costsByType = Object.entries(opsByType).map(([type, ops]) => {
                              let setupTime = 0;
                              let runTime = 0;
                              let nreTime = 0;
                              let laborCost = 0;
                              let machineCost = 0;
                              let overheadCost = 0;
                              let toolingCost = 0;

                              ops.forEach(op => {
                                const setupHrs = (op.setupTime || 0) / 60;
                                const nreHrs = (op.nreSetupTime || 0) / 60;
                                const cycleHrs = ((op.cycleTimeManned || 0) / 60) * qty;
                                const lightsOutHrs = op.lightsOutHours || 0;

                                setupTime += setupHrs;
                                runTime += cycleHrs + lightsOutHrs;
                                nreTime += nreHrs;

                                // Get labor rate for this op type
                                let laborRate = laborRates.setup;
                                if (type === 'Manufacturing' || type === 'Stock Prep' || type === 'Fixture Development') {
                                  const setupLabor = setupHrs * laborRates.setup * (1 + laborBurdenPercent / 100);
                                  const runLabor = cycleHrs * laborRates.mannedRun * (1 + laborBurdenPercent / 100);
                                  const nreLabor = nreHrs * laborRates.setup * (1 + laborBurdenPercent / 100);
                                  laborCost += setupLabor + runLabor + nreLabor;

                                  // Machine costs
                                  const machine = machines.find(m => m.name === op.machine);
                                  const machineRate = machine?.rate || 0;
                                  const totalMachineHrs = setupHrs + cycleHrs + lightsOutHrs + nreHrs;
                                  machineCost += totalMachineHrs * machineRate;
                                  overheadCost += totalMachineHrs * overheadRate;
                                  if (includeBurdenedTooling) toolingCost += totalMachineHrs * toolingBurden;
                                } else if (type === 'Programming') {
                                  laborCost += (setupHrs + nreHrs) * laborRates.programming * (1 + laborBurdenPercent / 100);
                                } else if (type === 'Planning') {
                                  laborCost += (setupHrs + nreHrs) * laborRates.manufacturingPlanner * (1 + laborBurdenPercent / 100);
                                } else if (type === 'Inspection') {
                                  laborCost += (setupHrs + cycleHrs + nreHrs) * laborRates.inspection * (1 + laborBurdenPercent / 100);
                                } else if (type === 'Assembly') {
                                  const assemblyRate = laborRates.assembly || 55;
                                  laborCost += (setupHrs + cycleHrs + nreHrs) * assemblyRate * (1 + laborBurdenPercent / 100);
                                } else if (type === 'Shipping') {
                                  laborCost += (setupHrs + nreHrs) * laborRates.shippingReceiving * (1 + laborBurdenPercent / 100);
                                }
                              });

                              return {
                                type,
                                setupTime,
                                runTime,
                                nreTime,
                                totalTime: setupTime + runTime + nreTime,
                                laborCost,
                                machineCost,
                                overheadCost,
                                toolingCost,
                                totalCost: laborCost + machineCost + overheadCost + toolingCost
                              };
                            });

                            // Sort by total cost descending
                            costsByType.sort((a, b) => b.totalCost - a.totalCost);

                            // Calculate totals for percentages
                            const totalLabor = costsByType.reduce((sum, item) => sum + item.laborCost, 0);
                            const totalMachine = costsByType.reduce((sum, item) => sum + item.machineCost, 0);
                            const totalOverhead = costsByType.reduce((sum, item) => sum + item.overheadCost, 0);
                            const totalTooling = costsByType.reduce((sum, item) => sum + item.toolingCost, 0);
                            const totalCOGS = actualMaterialCost + actualOutsideProcessing + parseFloat(directTooling || 0);
                            const grandTotal = totalLabor + totalMachine + totalOverhead + totalTooling + totalCOGS;

                            return (
                              <div style={{ overflowX: 'auto' }}>
                                <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 12 }}>
                                  <thead>
                                    <tr style={{ borderBottom: '2px solid rgba(255,255,255,0.1)', background: 'rgba(255,255,255,0.03)' }}>
                                      <th style={{ padding: '10px 8px', textAlign: 'left', color: '#4fd18b', fontWeight: 600 }}>Operation Type</th>
                                      <th style={{ padding: '10px 8px', textAlign: 'right', color: '#9fb0d9', fontWeight: 600 }}>Setup (h)</th>
                                      <th style={{ padding: '10px 8px', textAlign: 'right', color: '#9fb0d9', fontWeight: 600 }}>Run (h)</th>
                                      <th style={{ padding: '10px 8px', textAlign: 'right', color: '#9fb0d9', fontWeight: 600 }}>NRE (h)</th>
                                      <th style={{ padding: '10px 8px', textAlign: 'right', color: '#9fb0d9', fontWeight: 600 }}>Total (h)</th>
                                      <th style={{ padding: '10px 8px', textAlign: 'right', color: '#9fb0d9', fontWeight: 600 }}>Labor ($)</th>
                                      <th style={{ padding: '10px 8px', textAlign: 'right', color: '#9fb0d9', fontWeight: 600 }}>Machine ($)</th>
                                      <th style={{ padding: '10px 8px', textAlign: 'right', color: '#9fb0d9', fontWeight: 600 }}>Overhead ($)</th>
                                      {includeBurdenedTooling && (
                                        <th style={{ padding: '10px 8px', textAlign: 'right', color: '#9fb0d9', fontWeight: 600 }}>Tooling ($)</th>
                                      )}
                                      <th style={{ padding: '10px 8px', textAlign: 'right', color: '#4fd18b', fontWeight: 600 }}>Total Cost ($)</th>
                                      <th style={{ padding: '10px 8px', textAlign: 'right', color: '#4fd18b', fontWeight: 600 }}>Cost/Part ($)</th>
                                    </tr>
                                  </thead>
                                  <tbody>
                                    {costsByType.map((item, idx) => (
                                      <tr key={idx} style={{ borderBottom: '1px solid rgba(255,255,255,0.05)' }}>
                                        <td style={{ padding: '8px', color: '#eaf0ff', fontWeight: 600 }}>{item.type}</td>
                                        <td style={{ padding: '8px', textAlign: 'right', color: '#9fb0d9' }}>{item.setupTime.toFixed(2)}</td>
                                        <td style={{ padding: '8px', textAlign: 'right', color: '#9fb0d9' }}>{item.runTime.toFixed(2)}</td>
                                        <td style={{ padding: '8px', textAlign: 'right', color: '#f4a261' }}>{item.nreTime.toFixed(2)}</td>
                                        <td style={{ padding: '8px', textAlign: 'right', color: '#eaf0ff', fontWeight: 600 }}>{item.totalTime.toFixed(2)}</td>
                                        <td style={{ padding: '8px', textAlign: 'right' }}>{fmt(item.laborCost)}</td>
                                        <td style={{ padding: '8px', textAlign: 'right' }}>{fmt(item.machineCost)}</td>
                                        <td style={{ padding: '8px', textAlign: 'right' }}>{fmt(item.overheadCost)}</td>
                                        {includeBurdenedTooling && (
                                          <td style={{ padding: '8px', textAlign: 'right' }}>{fmt(item.toolingCost)}</td>
                                        )}
                                        <td style={{ padding: '8px', textAlign: 'right', fontWeight: 600, color: '#4fd18b' }}>{fmt(item.totalCost)}</td>
                                        <td style={{ padding: '8px', textAlign: 'right', fontWeight: 600 }}>{fmt(item.totalCost / qty)}</td>
                                      </tr>
                                    ))}
                                    
                                    {/* Totals Row */}
                                    <tr style={{ borderTop: '2px solid rgba(255,255,255,0.15)', background: 'rgba(47,107,255,0.05)' }}>
                                      <td style={{ padding: '10px 8px', color: '#4fd18b', fontWeight: 700 }}>TOTALS</td>
                                      <td style={{ padding: '10px 8px', textAlign: 'right', fontWeight: 600 }}>
                                        {costsByType.reduce((sum, item) => sum + item.setupTime, 0).toFixed(2)}
                                      </td>
                                      <td style={{ padding: '10px 8px', textAlign: 'right', fontWeight: 600 }}>
                                        {costsByType.reduce((sum, item) => sum + item.runTime, 0).toFixed(2)}
                                      </td>
                                      <td style={{ padding: '10px 8px', textAlign: 'right', fontWeight: 600, color: '#f4a261' }}>
                                        {costsByType.reduce((sum, item) => sum + item.nreTime, 0).toFixed(2)}
                                      </td>
                                      <td style={{ padding: '10px 8px', textAlign: 'right', fontWeight: 700, color: '#eaf0ff' }}>
                                        {costsByType.reduce((sum, item) => sum + item.totalTime, 0).toFixed(2)}
                                      </td>
                                      <td style={{ padding: '10px 8px', textAlign: 'right', fontWeight: 700 }}>
                                        {fmt(totalLabor)}
                                      </td>
                                      <td style={{ padding: '10px 8px', textAlign: 'right', fontWeight: 700 }}>
                                        {fmt(totalMachine)}
                                      </td>
                                      <td style={{ padding: '10px 8px', textAlign: 'right', fontWeight: 700 }}>
                                        {fmt(totalOverhead)}
                                      </td>
                                      {includeBurdenedTooling && (
                                        <td style={{ padding: '10px 8px', textAlign: 'right', fontWeight: 700 }}>
                                          {fmt(totalTooling)}
                                        </td>
                                      )}
                                      <td style={{ padding: '10px 8px', textAlign: 'right', fontWeight: 700, color: '#4fd18b' }}>
                                        {fmt(costsByType.reduce((sum, item) => sum + item.totalCost, 0))}
                                      </td>
                                      <td style={{ padding: '10px 8px', textAlign: 'right', fontWeight: 700 }}>
                                        {fmt(costsByType.reduce((sum, item) => sum + item.totalCost, 0) / qty)}
                                      </td>
                                    </tr>

                                    {/* Add COGS rows */}
                                    {actualMaterialCost > 0 && (
                                      <tr style={{ borderTop: '1px solid rgba(255,255,255,0.08)' }}>
                                        <td style={{ padding: '8px', color: '#eaf0ff', fontWeight: 600 }}>Material</td>
                                        <td colSpan={includeBurdenedTooling ? 8 : 7}></td>
                                        <td style={{ padding: '8px', textAlign: 'right', fontWeight: 600 }}>{fmt(actualMaterialCost)}</td>
                                        <td style={{ padding: '8px', textAlign: 'right', fontWeight: 600 }}>{fmt(actualMaterialCost / qty)}</td>
                                      </tr>
                                    )}
                                    {actualOutsideProcessing > 0 && (
                                      <tr>
                                        <td style={{ padding: '8px', color: '#eaf0ff', fontWeight: 600 }}>Outside Processing</td>
                                        <td colSpan={includeBurdenedTooling ? 8 : 7}></td>
                                        <td style={{ padding: '8px', textAlign: 'right', fontWeight: 600 }}>{fmt(actualOutsideProcessing)}</td>
                                        <td style={{ padding: '8px', textAlign: 'right', fontWeight: 600 }}>{fmt(actualOutsideProcessing / qty)}</td>
                                      </tr>
                                    )}
                                    {parseFloat(directTooling || 0) > 0 && (
                                      <tr>
                                        <td style={{ padding: '8px', color: '#eaf0ff', fontWeight: 600 }}>Direct Tooling</td>
                                        <td colSpan={includeBurdenedTooling ? 8 : 7}></td>
                                        <td style={{ padding: '8px', textAlign: 'right', fontWeight: 600 }}>{fmt(parseFloat(directTooling))}</td>
                                        <td style={{ padding: '8px', textAlign: 'right', fontWeight: 600 }}>{fmt(parseFloat(directTooling) / qty)}</td>
                                      </tr>
                                    )}

                                    {/* Grand Total */}
                                    <tr style={{ borderTop: '3px solid rgba(47,107,255,0.3)', background: 'rgba(47,107,255,0.1)' }}>
                                      <td style={{ padding: '12px 8px', fontSize: 14, color: '#2f6bff', fontWeight: 700 }}>TOTAL COST</td>
                                      <td colSpan={includeBurdenedTooling ? 8 : 7}></td>
                                      <td style={{ padding: '12px 8px', textAlign: 'right', fontSize: 14, fontWeight: 700, color: '#2f6bff' }}>
                                        {fmt(grandTotal)}
                                      </td>
                                      <td style={{ padding: '12px 8px', textAlign: 'right', fontSize: 14, fontWeight: 700, color: '#2f6bff' }}>
                                        {fmt(grandTotal / qty)}
                                      </td>
                                    </tr>
                                  </tbody>
                                </table>

                                {/* Cost Category Summary - Management Accounts Style */}
                                <div style={{ marginTop: 20, display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: 12 }}>
                                  <div style={{ padding: 16, background: 'rgba(79,209,139,0.1)', borderRadius: 8, border: '1px solid rgba(79,209,139,0.3)' }}>
                                    <div style={{ fontSize: 11, color: '#9fb0d9', marginBottom: 4 }}>COGS</div>
                                    <div style={{ fontSize: 20, fontWeight: 700, color: '#4fd18b', marginBottom: 4 }}>
                                      {fmt(totalCOGS)}
                                    </div>
                                    <div style={{ fontSize: 13, color: '#4fd18b' }}>
                                      {((totalCOGS / grandTotal) * 100).toFixed(1)}% of total
                                    </div>
                                  </div>
                                  
                                  <div style={{ padding: 16, background: 'rgba(47,107,255,0.1)', borderRadius: 8, border: '1px solid rgba(47,107,255,0.3)' }}>
                                    <div style={{ fontSize: 11, color: '#9fb0d9', marginBottom: 4 }}>Labor</div>
                                    <div style={{ fontSize: 20, fontWeight: 700, color: '#2f6bff', marginBottom: 4 }}>
                                      {fmt(totalLabor)}
                                    </div>
                                    <div style={{ fontSize: 13, color: '#2f6bff' }}>
                                      {((totalLabor / grandTotal) * 100).toFixed(1)}% of total
                                    </div>
                                  </div>
                                  
                                  <div style={{ padding: 16, background: 'rgba(244,162,97,0.1)', borderRadius: 8, border: '1px solid rgba(244,162,97,0.3)' }}>
                                    <div style={{ fontSize: 11, color: '#9fb0d9', marginBottom: 4 }}>Overhead</div>
                                    <div style={{ fontSize: 20, fontWeight: 700, color: '#f4a261', marginBottom: 4 }}>
                                      {fmt(totalOverhead)}
                                    </div>
                                    <div style={{ fontSize: 13, color: '#f4a261' }}>
                                      {((totalOverhead / grandTotal) * 100).toFixed(1)}% of total
                                    </div>
                                  </div>
                                  
                                  <div style={{ padding: 16, background: 'rgba(159,176,217,0.1)', borderRadius: 8, border: '1px solid rgba(159,176,217,0.3)' }}>
                                    <div style={{ fontSize: 11, color: '#9fb0d9', marginBottom: 4 }}>Machine</div>
                                    <div style={{ fontSize: 20, fontWeight: 700, color: '#9fb0d9', marginBottom: 4 }}>
                                      {fmt(totalMachine)}
                                    </div>
                                    <div style={{ fontSize: 13, color: '#9fb0d9' }}>
                                      {((totalMachine / grandTotal) * 100).toFixed(1)}% of total
                                    </div>
                                  </div>
                                  
                                  {includeBurdenedTooling && totalTooling > 0 && (
                                    <div style={{ padding: 16, background: 'rgba(200,200,200,0.1)', borderRadius: 8, border: '1px solid rgba(200,200,200,0.3)' }}>
                                      <div style={{ fontSize: 11, color: '#9fb0d9', marginBottom: 4 }}>Tooling</div>
                                      <div style={{ fontSize: 20, fontWeight: 700, color: '#c8c8c8', marginBottom: 4 }}>
                                        {fmt(totalTooling)}
                                      </div>
                                      <div style={{ fontSize: 13, color: '#c8c8c8' }}>
                                        {((totalTooling / grandTotal) * 100).toFixed(1)}% of total
                                      </div>
                                    </div>
                                  )}
                                </div>
                              </div>
                            );
                          })()}
                        </div>
                      )}
                    </div>

                  </div>
                </div>
              </>
            )}

            {/* LABOR BURDEN CALC MODAL */}
            {showLaborCalc && (
              <>
                <div onClick={() => setShowLaborCalc(false)} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.6)', zIndex: 950 }} />
                <div style={{
                  position: 'fixed',
                  top: '50%',
                  left: '50%',
                  transform: 'translate(-50%, -50%)',
                  background: 'linear-gradient(180deg, #101c36, #0b1223)',
                  border: '1px solid rgba(255,255,255,0.08)',
                  borderRadius: 16,
                  padding: 20,
                  zIndex: 1050,
                  minWidth: 400,
                  maxWidth: '90vw'
                }}>
                  <h3 style={{ margin: '0 0 16px', fontSize: 16 }}>Labor Burden Calculator</h3>
                  <div style={{ display: 'grid', gap: 12 }}>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, alignItems: 'center' }}>
                      <label style={{ fontSize: 12, color: '#9fb0d9', display: 'flex', alignItems: 'center' }}>
                        Base Wages ($)
                        <Tooltip text="Total annual or period wages paid to employees before any taxes or benefits." />
                      </label>
                      <input type="number" value={laborCalcInputs.wages}
                        onChange={e => setLaborCalcInputs({ ...laborCalcInputs, wages: parseFloat(e.target.value) || 0 })}
                        style={inputStyle}
                      />
                    </div>

                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, alignItems: 'center' }}>
                      <label style={{ fontSize: 12, color: '#9fb0d9', display: 'flex', alignItems: 'center' }}>
                        Burden Cost ($)
                        <Tooltip text="All extra labor costs: payroll taxes, healthcare, pension/401k, workers comp insurance, etc." />
                      </label>
                      <input type="number" value={laborCalcInputs.burdenCost}
                        onChange={e => setLaborCalcInputs({ ...laborCalcInputs, burdenCost: parseFloat(e.target.value) || 0 })}
                        style={inputStyle}
                        placeholder="Tax, benefits, healthcare, etc."
                      />
                    </div>

                    <div style={{
                      padding: 12,
                      background: '#2f6bff22',
                      borderRadius: 8,
                      border: '1px solid #2f6bff44',
                      textAlign: 'center'
                    }}>
                      <div style={{ fontSize: 11, color: '#9fb0d9', marginBottom: 4 }}>Calculated Burden %</div>
                      <div style={{ fontSize: 24, fontWeight: 'bold', color: '#2f6bff' }}>
                        {laborCalcInputs.wages > 0 ? ((laborCalcInputs.burdenCost / laborCalcInputs.wages) * 100).toFixed(1) : '0.0'}%
                      </div>
                      <div style={{ fontSize: 11, color: '#9fb0d9', marginTop: 4 }}>
                        Total Cost: {fmt(laborCalcInputs.wages + laborCalcInputs.burdenCost)}
                      </div>
                    </div>

                    <div style={{ display: 'flex', gap: 8 }}>
                      <button onClick={() => {
                        if (laborCalcInputs.wages > 0) setLaborBurdenPercent((laborCalcInputs.burdenCost / laborCalcInputs.wages) * 100);
                        setShowLaborCalc(false);
                      }} style={{
                        flex: 1,
                        padding: '10px',
                        borderRadius: 8,
                        border: '1px solid #2f6bff',
                        background: '#2f6bff',
                        color: 'white',
                        cursor: 'pointer',
                        fontSize: 13
                      }}>Apply</button>

                      <button onClick={() => setShowLaborCalc(false)} style={{
                        flex: 1,
                        padding: '10px',
                        borderRadius: 8,
                        border: '1px solid rgba(255,255,255,0.08)',
                        background: '#121c35',
                        color: '#9fb0d9',
                        cursor: 'pointer',
                        fontSize: 13
                      }}>Cancel</button>
                    </div>
                  </div>
                </div>
              </>
            )}

            {/* OVERHEAD CALC MODAL */}
            {showOverheadCalc && (
              <>
                <div onClick={() => setShowOverheadCalc(false)} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.6)', zIndex: 950 }} />
                <div style={{
                  position: 'fixed',
                  top: '50%',
                  left: '50%',
                  transform: 'translate(-50%, -50%)',
                  background: 'linear-gradient(180deg, #101c36, #0b1223)',
                  border: '1px solid rgba(255,255,255,0.08)',
                  borderRadius: 16,
                  padding: 20,
                  zIndex: 1050,
                  minWidth: 400,
                  maxWidth: '90vw'
                }}>
                  <h3 style={{ margin: '0 0 16px', fontSize: 16 }}>Overhead Rate Calculator</h3>
                  <div style={{ display: 'grid', gap: 12 }}>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, alignItems: 'center' }}>
                      <label style={{ fontSize: 12, color: '#9fb0d9', display: 'flex', alignItems: 'center' }}>
                        Total Overhead ($)
                        <Tooltip text="All indirect costs for the period: rent, utilities, insurance, office supplies, repairs & maintenance, business loan interest, admin costs, indirect wages (directors, managers, office staff), etc. Do NOT include direct labor wages here." />
                      </label>
                      <input type="number" value={overheadCalcInputs.totalOverhead}
                        onChange={e => setOverheadCalcInputs({ ...overheadCalcInputs, totalOverhead: parseFloat(e.target.value) || 0 })}
                        style={inputStyle}
                      />
                    </div>

                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, alignItems: 'center' }}>
                      <label style={{ fontSize: 12, color: '#9fb0d9', display: 'flex', alignItems: 'center' }}>
                        Total Machine Hours
                        <Tooltip text="Total productive machine hours across all machines for the same period. Use the calculator to compute this." />
                      </label>
                      <div style={{ display: 'flex', gap: 6 }}>
                        <input
                          type="number"
                          value={overheadCalcInputs.totalMachineHours}
                          onChange={e => setOverheadCalcInputs({ ...overheadCalcInputs, totalMachineHours: parseFloat(e.target.value) || 0 })}
                          style={{ ...inputStyle, flex: 1 }}
                        />
                        <button onClick={() => setShowMachineHoursCalc(true)} style={calcBtnStyle} title="Machine Hours Calculator">
                          <CalculatorIcon size={14} />
                        </button>
                      </div>
                    </div>

                    <div style={{
                      padding: 12,
                      background: '#2f6bff22',
                      borderRadius: 8,
                      border: '1px solid #2f6bff44',
                      textAlign: 'center'
                    }}>
                      <div style={{ fontSize: 11, color: '#9fb0d9', marginBottom: 4 }}>Calculated Rate ($/Mh)</div>
                      <div style={{ fontSize: 24, fontWeight: 'bold', color: '#2f6bff' }}>
                        ${overheadCalcInputs.totalMachineHours > 0 ? (overheadCalcInputs.totalOverhead / overheadCalcInputs.totalMachineHours).toFixed(2) : '0.00'}
                      </div>
                    </div>

                    <div style={{ display: 'flex', gap: 8 }}>
                      <button onClick={() => {
                        if (overheadCalcInputs.totalMachineHours > 0) {
                          setOverheadRate(overheadCalcInputs.totalOverhead / overheadCalcInputs.totalMachineHours);
                        }
                        setShowOverheadCalc(false);
                      }} style={{
                        flex: 1,
                        padding: '10px',
                        borderRadius: 8,
                        border: '1px solid #2f6bff',
                        background: '#2f6bff',
                        color: 'white',
                        cursor: 'pointer',
                        fontSize: 13
                      }}>Apply</button>

                      <button onClick={() => setShowOverheadCalc(false)} style={{
                        flex: 1,
                        padding: '10px',
                        borderRadius: 8,
                        border: '1px solid rgba(255,255,255,0.08)',
                        background: '#121c35',
